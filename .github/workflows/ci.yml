name: CI

on:
  push:
  pull_request:

jobs:
  ruby-versions:
    uses: ruby/actions/.github/workflows/ruby_versions.yml@master

  test:
    needs: ruby-versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build OpenSSL with QUIC support
        run: |
          curl -fsSL https://github.com/openssl/openssl/releases/download/openssl-3.4.0/openssl-3.4.0.tar.gz | tar -xz
          cd openssl-3.4.0
          ./Configure --prefix=/opt/openssl --libdir=lib no-tests
          make -j$(nproc)
          sudo make install_sw
          sudo sh -c 'echo "/opt/openssl/lib" > /etc/ld.so.conf.d/openssl-quic.conf'
          sudo ldconfig
          echo "OPENSSL_PREFIX=/opt/openssl" >> "$GITHUB_ENV"

      - name: Set up Ruby
        uses: ruby/setup-ruby-pkgs@v1
        with:
          ruby-version: head

      - name: Set up Go
        uses: actions/setup-go@v5

      - name: Bundle install
        run: |
          bundle config build.openssl --with-openssl-dir="$OPENSSL_PREFIX"
          bundle install

      - name: Run tests
        env:
          CURL_HTTP3: /usr/bin/curl
        run: bundle exec rake test
