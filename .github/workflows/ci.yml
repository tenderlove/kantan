name: CI

on:
  push:
  pull_request:

jobs:
  ruby-versions:
    uses: ruby/actions/.github/workflows/ruby_versions.yml@master

  test:
    needs: ruby-versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install OpenSSL dev headers
        run: sudo apt-get install -y libssl-dev

      - name: Install OpenSSL with QUIC support
        run: |
          brew install openssl@3
          echo "OPENSSL_PREFIX=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Set up Ruby
        uses: ruby/setup-ruby-pkgs@v1
        with:
          ruby-version: head

      - name: Set up Go
        uses: actions/setup-go@v5

      - name: Bundle install
        run: |
          bundle config build.openssl --with-openssl-dir="$OPENSSL_PREFIX"
          bundle install

      - name: Run tests
        env:
          CURL_HTTP3: /usr/bin/curl
        run: bundle exec rake test
